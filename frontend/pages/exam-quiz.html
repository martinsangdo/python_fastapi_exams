<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Practice Test — ExamPrep</title>
  <link rel="stylesheet" href="/css/base.css"/>
  <link rel="stylesheet" href="/css/nav.css"/>
  <link rel="stylesheet" href="/css/components.css"/>
</head>
<body>

<!-- Quiz Header (replaces nav) -->
<div class="exam-quiz-header" id="quiz-header">
  <a href="#" id="back-link" style="color:rgba(255,255,255,.7);font-size:.875rem;display:flex;align-items:center;gap:8px">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15,18 9,12 15,6"/></svg>
    Back to Course
  </a>
  <span id="quiz-pkg-title" style="color:rgba(255,255,255,.8);font-weight:600;font-size:.875rem"></span>
  <div class="exam-timer" id="timer">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/></svg>
    <span id="timer-display">90:00</span>
  </div>
</div>

<!-- Quiz body -->
<div id="quiz-root"></div>

<script src="/js/app.js"></script>
<script>
const slug   = Utils.getParam('slug');
const pkgId  = Utils.getParam('pkg') || 'pkg-1';
const exam   = MOCK_EXAMS.find(e => e.slug === slug) || MOCK_EXAMS[0];
const pkg    = MOCK_PACKAGES.find(p => p.id === pkgId) || MOCK_PACKAGES[0];
const questions = MOCK_QUESTIONS;

let currentIdx = 0;
let answers    = {};     // { qid: [keys] }
let revealed   = {};     // { qid: true }
let timeLeft   = pkg.time_limit_minutes * 60;
let timerInterval = null;
let finished   = false;
let showHint   = false;
let hintText   = '';

document.getElementById('back-link').href = `/pages/exam-detail.html?slug=${slug}`;
document.getElementById('quiz-pkg-title').textContent = pkg.title + ' — ' + exam.title;

// ── Timer ──────────────────────────────────────────────────────────────────
function fmtTime(s) {
  return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
}

function startTimer() {
  timerInterval = setInterval(() => {
    timeLeft--;
    const el = document.getElementById('timer-display');
    if (el) {
      el.textContent = fmtTime(timeLeft);
      if (timeLeft <= 300) document.getElementById('timer')?.classList.add('warning');
    }
    if (timeLeft <= 0) { clearInterval(timerInterval); handleFinish(); }
  }, 1000);
}

// ── Scoring ────────────────────────────────────────────────────────────────
function isCorrect(q) {
  const ans = answers[q.id] || [];
  return JSON.stringify([...ans].sort()) === JSON.stringify([...q.correct].sort());
}

function getScore() {
  const correct = questions.filter(q => isCorrect(q)).length;
  return { correct, total: questions.length, pct: Math.round(correct/questions.length*100) };
}

function getOptionState(q, key) {
  if (!revealed[q.id]) return answers[q.id]?.includes(key) ? 'selected' : '';
  if (q.correct.includes(key)) return 'correct';
  if (answers[q.id]?.includes(key)) return 'wrong';
  return '';
}

// ── Actions ────────────────────────────────────────────────────────────────
function selectOption(key) {
  const q = questions[currentIdx];
  if (revealed[q.id]) return;
  if (q.type === 'multiple') {
    const prev = answers[q.id] || [];
    answers[q.id] = prev.includes(key) ? prev.filter(k=>k!==key) : [...prev, key];
  } else {
    answers[q.id] = [key];
  }
  renderQuestion();
}

function checkAnswer() {
  const q = questions[currentIdx];
  if (!answers[q.id]?.length) { Toast.show('Please select an answer first', 'error'); return; }
  revealed[q.id] = true;
  renderQuestion();
}

function handleFinish() {
  clearInterval(timerInterval);
  finished = true;
  renderResult();
}

async function getHint() {
  const q = questions[currentIdx];
  hintText = 'Loading AI hint...';
  showHint = true;
  renderQuestion();
  try {
    const res = await API.ai.hint(q.id, 'Give me a hint for this question');
    hintText = res.hint || 'Think carefully about the key concepts involved.';
  } catch { hintText = 'Think carefully about the specific requirements and trade-offs mentioned in the question.'; }
  renderQuestion();
}

// ── Render ─────────────────────────────────────────────────────────────────
function renderQuestion() {
  const q = questions[currentIdx];
  const answeredCount = Object.keys(answers).length;
  const pct = Math.round(((currentIdx+1)/questions.length)*100);

  document.getElementById('quiz-root').innerHTML = `
    <div class="exam-layout">
      <!-- Main -->
      <div class="exam-main">
        <!-- Progress -->
        <div style="margin-bottom:24px">
          <div class="flex-between mb-8">
            <span class="question-num">Question ${currentIdx+1} of ${questions.length}</span>
            <span class="t-sm t-muted">${answeredCount} answered</span>
          </div>
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        </div>

        <div class="question-badges">
          <span class="badge badge-gray">${q.type==='single'?'Single Answer':q.type==='multiple'?'Multiple Answers':'True / False'}</span>
          <span class="badge ${q.difficulty==='easy'?'badge-green':q.difficulty==='hard'?'badge-red':'badge-gold'}">${q.difficulty}</span>
          ${q.tags.map(t => `<span class="badge badge-purple">${t}</span>`).join('')}
        </div>

        <div class="question-text">${q.text}</div>

        ${q.options.map(opt => {
          const state = getOptionState(q, opt.key);
          return `<div class="option ${state} ${revealed[q.id]?'revealed':''}" data-key="${opt.key}">
            <div class="option-key">${opt.key}</div>
            <div style="flex:1">${opt.text}</div>
            ${revealed[q.id] && q.correct.includes(opt.key) ? `<span style="color:var(--green)">${Icons.check(16)}</span>` : ''}
            ${revealed[q.id] && answers[q.id]?.includes(opt.key) && !q.correct.includes(opt.key) ? `<span style="color:var(--red)">${Icons.x(16)}</span>` : ''}
          </div>`;
        }).join('')}

        ${revealed[q.id] ? `
          <div class="explanation-box">
            <div class="explanation-title">${Icons.info(16)} Explanation</div>
            <p class="t-body">${q.explanation}</p>
          </div>` : ''}

        ${showHint && !revealed[q.id] ? `
          <div class="hint-box">
            <div class="hint-title">${Icons.robot(16)} AI Hint</div>
            <p class="t-sm">${hintText}</p>
          </div>` : ''}

        <div class="quiz-actions">
          <div class="flex gap-8">
            ${!revealed[q.id] ? `<button class="btn btn-outline-purple btn-sm" id="hint-btn">${Icons.robot(14)} AI Hint</button>` : ''}
          </div>
          <div class="flex gap-12">
            <button class="btn btn-ghost" id="prev-btn" ${currentIdx===0?'disabled':''}>← Previous</button>
            ${!revealed[q.id]
              ? `<button class="btn btn-primary" id="check-btn">Check Answer</button>`
              : currentIdx < questions.length-1
                ? `<button class="btn btn-primary" id="next-btn">Next Question →</button>`
                : `<button class="btn btn-primary btn-lg" id="finish-btn">🎯 Finish Test</button>`}
          </div>
        </div>
      </div>

      <!-- Sidebar -->
      <div class="exam-sidebar">
        <div style="font-weight:700;margin-bottom:16px;font-size:.9375rem">Question Navigator</div>
        <div class="q-grid">
          ${questions.map((qItem, i) => {
            const isAns = answers[qItem.id];
            const isRev = revealed[qItem.id];
            const isCor = isRev && isCorrect(qItem);
            const cls = isRev ? (isCor?'correct':'wrong') : isAns?'answered':'';
            return `<div class="q-dot ${cls} ${i===currentIdx?'current':''}" data-qi="${i}">${i+1}</div>`;
          }).join('')}
        </div>

        <div class="divider" style="margin:20px 0"></div>
        <div class="flex-col gap-8 t-sm">
          ${[['var(--purple)','Answered'],['var(--green)','Correct'],['var(--red)','Incorrect'],['var(--border)','Unanswered']].map(([c,l]) =>
            `<div class="flex-center gap-8"><div style="width:14px;height:14px;border-radius:3px;background:${c};flex-shrink:0"></div><span class="t-muted">${l}</span></div>`
          ).join('')}
        </div>

        <div class="divider" style="margin:20px 0"></div>
        <div style="background:var(--white);border-radius:var(--r-md);padding:16px;border:1px solid var(--border)">
          <div style="font-weight:700;font-size:.875rem;margin-bottom:12px">Progress</div>
          <div class="flex-between t-sm mb-6"><span class="t-muted">Answered</span><span>${Object.keys(answers).length}/${questions.length}</span></div>
          <div class="progress-bar"><div class="progress-fill" style="width:${Object.keys(answers).length/questions.length*100}%"></div></div>
        </div>

        <button class="btn btn-ghost w-full mt-20" style="color:var(--red);border:1px solid var(--red)" id="submit-btn">Submit & Finish</button>
      </div>
    </div>
  `;

  // Events
  document.querySelectorAll('.option:not(.revealed)').forEach(o =>
    o.addEventListener('click', () => selectOption(o.dataset.key))
  );
  document.getElementById('prev-btn')?.addEventListener('click', () => { currentIdx--; showHint=false; renderQuestion(); });
  document.getElementById('next-btn')?.addEventListener('click', () => { currentIdx++; showHint=false; renderQuestion(); });
  document.getElementById('check-btn')?.addEventListener('click', checkAnswer);
  document.getElementById('finish-btn')?.addEventListener('click', handleFinish);
  document.getElementById('submit-btn')?.addEventListener('click', handleFinish);
  document.getElementById('hint-btn')?.addEventListener('click', getHint);
  document.querySelectorAll('.q-dot').forEach(dot =>
    dot.addEventListener('click', () => { currentIdx = parseInt(dot.dataset.qi); showHint=false; renderQuestion(); })
  );
}

function renderResult() {
  clearInterval(timerInterval);
  document.getElementById('quiz-header').style.display = 'none';
  const { correct, total, pct } = getScore();
  const pass = pct >= pkg.pass_score_pct;
  const timeUsed = fmtTime(pkg.time_limit_minutes * 60 - timeLeft);

  document.getElementById('quiz-root').innerHTML = `
    <div style="padding:48px 0;background:var(--surface);min-height:100vh">
      <div class="container-sm">
        <div class="result-card">
          <div class="result-score ${pass?'pass':'fail'}">
            <div class="result-pct ${pass?'pass':'fail'}">${pct}%</div>
            <div class="result-label ${pass?'pass':'fail'}">${pass?'PASS':'FAIL'}</div>
          </div>
          <h2 class="t-h2 mb-8">${pass ? '🎉 Congratulations!' : '📚 Keep Studying'}</h2>
          <p class="t-body t-muted mb-32">You scored <strong>${correct}/${total}</strong> correct · Pass score: <strong>${pkg.pass_score_pct}%</strong></p>
          <div class="grid-3 mb-32">
            <div class="stat-card"><div class="stat-card-num">${correct}</div><div class="stat-card-lbl">Correct</div></div>
            <div class="stat-card"><div class="stat-card-num" style="color:var(--red)">${total-correct}</div><div class="stat-card-lbl">Incorrect</div></div>
            <div class="stat-card"><div class="stat-card-num" style="font-size:1.5rem">${timeUsed}</div><div class="stat-card-lbl">Time Used</div></div>
          </div>
          <div class="flex gap-12" style="justify-content:center;flex-wrap:wrap">
            <a href="/pages/exam-detail.html?slug=${slug}" class="btn btn-outline">← Back to Course</a>
            <button class="btn btn-primary" id="retake-btn">Retake Test</button>
            <a href="/pages/my-learning.html" class="btn btn-ghost">My Learning</a>
          </div>
        </div>

        <!-- Answer review -->
        <h3 class="t-h2 mt-32 mb-20">Review Your Answers</h3>
        ${questions.map((q, i) => {
          const ans = answers[q.id] || [];
          const cor = isCorrect(q);
          const correctKeys = q.correct;
          return `
            <div style="background:var(--white);border:1px solid var(--border);border-radius:var(--r-md);padding:20px;margin-bottom:16px">
              <div class="flex gap-12 mb-12">
                <span class="badge ${cor?'badge-green':'badge-red'}">Q${i+1} ${cor?'✓':'✗'}</span>
                <span class="badge badge-gray">${q.difficulty}</span>
                ${q.tags.map(t=>`<span class="badge badge-purple">${t}</span>`).join('')}
              </div>
              <p style="font-weight:600;margin-bottom:12px;line-height:1.5">${q.text}</p>
              ${q.options.map(o => {
                const isAns = ans.includes(o.key);
                const isCor = q.correct.includes(o.key);
                const bg  = isCor ? 'var(--green-bg)' : isAns ? 'var(--red-bg)' : 'var(--white)';
                const bdr = isCor ? 'var(--green)'    : isAns ? 'var(--red)'    : 'var(--border)';
                return `<div style="padding:10px 14px;border-radius:var(--r);border:2px solid ${bdr};margin-bottom:8px;font-size:.9375rem;display:flex;gap:10px;background:${bg}">
                  <strong style="flex-shrink:0">${o.key}.</strong> ${o.text}
                  ${isCor ? `<span style="margin-left:auto;color:var(--green)">${Icons.check(14)}</span>` : ''}
                </div>`;
              }).join('')}
              <div style="margin-top:12px;padding:12px;background:var(--surface);border-radius:var(--r);font-size:.875rem;border-left:3px solid var(--purple)">
                <strong>Explanation:</strong> ${q.explanation}
              </div>
            </div>`;
        }).join('')}
      </div>
    </div>`;

  document.getElementById('retake-btn')?.addEventListener('click', () => {
    answers = {}; revealed = {}; currentIdx = 0; finished = false;
    showHint = false; timeLeft = pkg.time_limit_minutes*60;
    document.getElementById('quiz-header').style.display = 'flex';
    document.getElementById('timer').classList.remove('warning');
    document.getElementById('timer-display').textContent = fmtTime(timeLeft);
    renderQuestion();
    startTimer();
  });
}

document.addEventListener('DOMContentLoaded', () => {
  Toast.init();
  renderQuestion();
  startTimer();
});
</script>
</body>
</html>
