<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Learning — CertQuestionBank</title>
  <link rel="stylesheet" href="/css/base.css"/>
  <link rel="stylesheet" href="/css/nav.css"/>
  <link rel="stylesheet" href="/css/components.css"/>
</head>
<body>
<div id="nav-root"></div>

<!-- Header -->
<div style="background:var(--navy);padding:40px 0">
  <div class="container">
    <h1 class="t-h1" style="color:#fff;margin-bottom:8px">My Learning</h1>
    <p style="color:rgba(255,255,255,.7)">Continue where you left off</p>
  </div>
</div>

<!-- Tabs -->
<div class="sticky-bar">
  <div class="container">
    <div class="tabs" id="learning-tabs">
      <button class="tab active" data-tab="courses">My Courses</button>
      <button class="tab" data-tab="progress">Progress</button>
    </div>
  </div>
</div>

<div class="container" style="padding:32px 24px 64px">
  <div id="tab-content"><div class="loading-spinner" style="margin:60px auto"></div></div>
</div>

<div id="footer-root"></div>
<script src="/js/app.js"></script>
<script>
let activeTab = 'courses';
let pageData = null; // { courses, completedAttempts }

function requireAuth() {
  if (!State.user) { window.location.href = '/login?redirect=/my-learning'; return false; }
  return true;
}

async function loadData() {
  const [purchases, attemptsRes] = await Promise.all([
    API.payments.myPurchases(),
    API.attempts.list(),
  ]);

  const purchaseList = purchases || [];

  const completedAttempts = (attemptsRes?.items || []).filter(a => a.status === 'completed');

  const attemptsByExam = {};
  completedAttempts.forEach(a => {
    if (!attemptsByExam[a.exam_id]) attemptsByExam[a.exam_id] = [];
    attemptsByExam[a.exam_id].push(a);
  });

  const courses = purchaseList.map(p => {
    // Use enriched exam info returned directly from the purchases endpoint
    const exam = p.exam_title ? {
      id: p.exam_id,
      title: p.exam_title,
      slug: p.exam_slug,
      thumbnail_url: p.exam_thumbnail,
      category: p.exam_category || '',
    } : null;
    const examAttempts = attemptsByExam[p.exam_id] || [];
    const scores = examAttempts.map(a => a.score).filter(s => s != null);
    const bestScore = scores.length ? Math.max(...scores) : null;
    return { exam, purchase: p, attempts: examAttempts, bestScore };
  }).filter(c => c.exam);

  return { courses, completedAttempts };
}

function renderCourses(courses) {
  if (!courses.length) {
    return `<div class="empty-state">
      <div class="icon">📚</div>
      <h3 class="t-h3">No courses yet</h3>
      <p class="t-muted mt-8 mb-16">Browse our catalog and purchase a course to get started</p>
      <a href="/" class="btn btn-primary">Browse Exams</a>
    </div>`;
  }
  return `
    <div class="section-header">
      <div><h2 class="t-h2">${courses.length} Course${courses.length !== 1 ? 's' : ''}</h2></div>
    </div>
    <div class="grid-3">
      ${courses.map(({ exam, attempts, bestScore }) => {
        const totalAttempts = attempts.length;
        const passCount = attempts.filter(a => a.passed).length;
        const lastAttempt = attempts.sort((a, b) => new Date(b.started_at) - new Date(a.started_at))[0];
        const lastPkg = lastAttempt?.package_id || null;
        const continueHref = lastPkg
          ? `/exam-quiz?slug=${exam.slug}&pkg=${lastPkg}`
          : `/detail/${exam.slug}`;
        return `
          <div class="card learning-card" data-slug="${exam.slug}">
            <div class="learning-card-thumb" style="background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:2rem;min-height:100px">
              ${exam.thumbnail_url
                ? `<img src="${exam.thumbnail_url}" style="max-width:100%;max-height:100%;object-fit:contain" alt="" onerror="this.replaceWith(document.createTextNode('📋'))" />`
                : '📋'}
            </div>
            <div class="learning-card-body">
              <div class="learning-card-title truncate-2">${exam.title}</div>
              <div class="learning-card-sub">${exam.category}</div>
              ${bestScore !== null ? `
                <div class="flex-between t-sm mb-4">
                  <span class="t-muted">Best score</span>
                  <span class="t-muted">${bestScore.toFixed(0)}%</span>
                </div>
                <div class="progress-bar mb-16">
                  <div class="progress-fill ${bestScore >= 72 ? 'green' : ''}" style="width:${Math.min(bestScore,100)}%"></div>
                </div>` : `<div class="mb-16 t-sm t-muted">No attempts yet</div>`}
              <div class="flex gap-8">
                <a href="${continueHref}" class="btn btn-primary btn-sm" style="flex:1"
                   onclick="event.stopPropagation()">${lastAttempt ? 'Continue →' : 'Start →'}</a>
                <a href="/detail/${exam.slug}" class="btn btn-ghost btn-sm btn-icon"
                   onclick="event.stopPropagation()">${Icons.info(14)}</a>
              </div>
              <div class="flex gap-16 mt-12 t-xs t-muted">
                <span>${Icons.book(12)} ${totalAttempts} test${totalAttempts !== 1 ? 's' : ''} taken</span>
                ${bestScore !== null ? `<span>${Icons.award(12)} Best: ${bestScore.toFixed(0)}%</span>` : ''}
              </div>
            </div>
          </div>`;
      }).join('')}
    </div>`;
}

function renderProgress(courses, completedAttempts) {
  const totalAttempts = completedAttempts.length;
  const passed = completedAttempts.filter(a => a.passed).length;
  const scores = completedAttempts.map(a => a.score).filter(s => s != null);
  const avgScore = scores.length ? scores.reduce((a, b) => a + b, 0) / scores.length : 0;

  return `
    <h2 class="t-h2 mb-24">Your Progress</h2>
    <div class="grid-4 mb-32">
      ${[
        { num: courses.length,            lbl: 'Enrolled',    icon: 'book'  },
        { num: totalAttempts,             lbl: 'Tests Taken', icon: 'award' },
        { num: avgScore.toFixed(0) + '%', lbl: 'Avg Score',   icon: 'chart' },
        { num: passed,                    lbl: 'Tests Passed', icon: 'check' },
      ].map(s => `
        <div class="stat-card">
          <div style="color:var(--purple);margin-bottom:8px">${Icons[s.icon]?.(24) || ''}</div>
          <div class="stat-card-num">${s.num}</div>
          <div class="stat-card-lbl">${s.lbl}</div>
        </div>`).join('')}
    </div>
    ${courses.length === 0 ? `<div class="empty-state"><p class="t-muted">Purchase a course to track progress here.</p></div>` : ''}
    ${courses.map(({ exam, attempts, bestScore }) => {
      const examAttempts = attempts.filter(a => a.status === 'completed');
      const sorted = [...examAttempts].sort((a, b) => new Date(a.started_at) - new Date(b.started_at));
      return `
        <div class="admin-card mb-16">
          <div class="flex-between mb-16 flex-wrap gap-12">
            <div class="flex-center gap-12">
              ${exam.thumbnail_url
                ? `<img src="${exam.thumbnail_url}" style="width:40px;height:40px;object-fit:contain" alt="" onerror="this.replaceWith(document.createTextNode('📋'))" />`
                : `<span style="font-size:1.75rem">📋</span>`}
              <div>
                <div style="font-weight:700">${exam.title}</div>
                <div class="t-sm t-muted">${examAttempts.length} test${examAttempts.length !== 1 ? 's' : ''} taken${bestScore !== null ? ' · Best score: ' + bestScore.toFixed(0) + '%' : ''}</div>
              </div>
            </div>
            ${bestScore !== null
              ? `<span class="badge ${bestScore >= 72 ? 'badge-green' : 'badge-red'}">${bestScore >= 72 ? 'Passed' : 'In Progress'}</span>`
              : '<span class="badge">Not started</span>'}
          </div>
          ${bestScore !== null ? `
            <div class="flex-between t-sm mb-6">
              <span class="t-muted">Best Score</span>
              <span style="font-weight:600">${bestScore.toFixed(0)}%</span>
            </div>
            <div class="progress-bar" style="height:12px">
              <div class="progress-fill ${bestScore >= 72 ? 'green' : ''}" style="width:${Math.min(bestScore,100)}%"></div>
            </div>` : ''}
          <div class="flex gap-8 mt-16 flex-wrap">
            ${Array.from({ length: 6 }, (_, i) => {
              const pkgNum = i + 1;
              // Find best attempt for this specific package number
              const pkgAttempts = examAttempts.filter(a => {
                const pid = a.package_id || '';
                return pid === `pkg-${pkgNum}` || pid.endsWith(`-${pkgNum}`);
              });
              const best = pkgAttempts.reduce((b, a) => (a.score > (b?.score ?? -1) ? a : b), null);
              const score = best ? best.score : null;
              const bg    = score === null ? 'var(--surface)' : score >= 72 ? 'var(--green-bg)' : 'var(--red-bg)';
              const color = score === null ? 'var(--ink-soft)' : score >= 72 ? 'var(--green)' : 'var(--red)';
              return `<div style="padding:8px 12px;border-radius:var(--r);background:${bg};color:${color};font-size:.8125rem;font-weight:600">
                T${pkgNum}: ${score !== null ? score.toFixed(0) + '%' : '—'}
              </div>`;
            }).join('')}
          </div>
        </div>`;
    }).join('')}`;
}

const TABS = {
  courses:  () => renderCourses(pageData.courses),
  progress: () => renderProgress(pageData.courses, pageData.completedAttempts),
};

function renderTab() {
  document.getElementById('tab-content').innerHTML = TABS[activeTab]?.() || '';
  document.querySelectorAll('.learning-card').forEach(c =>
    c.addEventListener('click', () => window.location.href = `/detail/${c.dataset.slug}`)
  );
}

document.addEventListener('DOMContentLoaded', async () => {
  if (!requireAuth()) return;
  Nav.render('my-learning');
  Footer.render();

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      activeTab = tab.dataset.tab;
      renderTab();
    });
  });

  try {
    pageData = await loadData();
  } catch (e) {
    document.getElementById('tab-content').innerHTML =
      `<div class="empty-state"><p class="t-muted">Failed to load your courses. Please refresh.</p></div>`;
    return;
  }

  renderTab();
});
</script>
</body>
</html>
