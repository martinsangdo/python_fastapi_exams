<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password — ExamPrep</title>
  <link rel="stylesheet" href="/css/base.css"/>
  <link rel="stylesheet" href="/css/nav.css"/>
  <link rel="stylesheet" href="/css/components.css"/>
</head>
<body>
<div id="nav-root"></div>
<div class="auth-page">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="auth-logo-text">ExamPrep</div>
      <h2 class="t-h2 mt-8 mb-4">Choose a new password</h2>
      <p class="t-muted t-sm">Make it strong — at least 8 characters with a number and uppercase letter</p>
    </div>

    <div id="msg-box"></div>

    <form id="reset-form" style="display:flex;flex-direction:column;gap:16px">
      <div class="input-group">
        <label class="input-label">New password</label>
        <input class="input" id="password" type="password" placeholder="New password" autocomplete="new-password" required/>
      </div>
      <div class="input-group">
        <label class="input-label">Confirm new password</label>
        <input class="input" id="confirm" type="password" placeholder="Repeat password" autocomplete="new-password" required/>
      </div>
      <button class="btn btn-primary btn-lg w-full" type="submit" id="submit-btn">Reset Password</button>
    </form>

    <p class="t-sm t-muted t-center mt-24">
      <a href="/login" style="color:var(--purple);font-weight:600">Back to login</a>
    </p>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
function showMsg(msg, type = 'error') {
  const el = document.getElementById('msg-box');
  el.innerHTML = `<div class="alert alert-${type} mb-16">${Icons.info(16)} ${msg}</div>`;
}

const token = Utils.getParam('token');

document.addEventListener('DOMContentLoaded', () => {
  Nav.render();
  if (!token) {
    document.getElementById('reset-form').style.display = 'none';
    showMsg('Invalid or missing reset link. Please request a new one.');
  }
});

document.getElementById('reset-form').addEventListener('submit', async e => {
  e.preventDefault();
  const password = document.getElementById('password').value;
  const confirm  = document.getElementById('confirm').value;

  if (password !== confirm) { showMsg('Passwords do not match.'); return; }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = 'Saving…';

  try {
    await API.auth.resetPassword({ token, new_password: password });
    document.getElementById('reset-form').style.display = 'none';
    showMsg('Password updated! Redirecting to login…', 'success');
    setTimeout(() => { window.location.href = '/login'; }, 2000);
  } catch (err) {
    showMsg(err.message || 'Something went wrong. Please try again.');
    btn.disabled = false;
    btn.textContent = 'Reset Password';
  }
});
</script>
</body>
</html>
