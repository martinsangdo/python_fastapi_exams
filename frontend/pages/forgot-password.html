<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password — CertQuestionBank</title>
  <link rel="stylesheet" href="/css/base.css"/>
  <link rel="stylesheet" href="/css/nav.css"/>
  <link rel="stylesheet" href="/css/components.css"/>
</head>
<body>
<div id="nav-root"></div>
<div class="auth-page">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="auth-logo-text">CertQuestionBank</div>
      <h2 class="t-h2 mt-8 mb-4">Reset your password</h2>
      <p class="t-muted t-sm">Enter your email and we'll send you a reset link</p>
    </div>

    <div id="msg-box"></div>

    <form id="forgot-form" style="display:flex;flex-direction:column;gap:16px">
      <div class="input-group">
        <label class="input-label">Email address</label>
        <input class="input" id="email" type="email" placeholder="you@example.com" autocomplete="email" required/>
      </div>
      <button class="btn btn-primary btn-lg w-full" type="submit" id="submit-btn">Send Reset Link</button>
    </form>

    <p class="t-sm t-muted t-center mt-24">
      Remembered it? <a href="/login" style="color:var(--purple);font-weight:600">Back to login</a>
    </p>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
function showMsg(msg, type = 'success') {
  const el = document.getElementById('msg-box');
  el.innerHTML = `<div class="alert alert-${type} mb-16">${Icons.info(16)} ${msg}</div>`;
}

document.getElementById('forgot-form').addEventListener('submit', async e => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  if (!email) return;

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = 'Sending…';

  try {
    await API.auth.forgotPassword({ email });
    document.getElementById('forgot-form').style.display = 'none';
    showMsg('If that email is registered you will receive a reset link shortly. Check your inbox.');
  } catch (e) {
    showMsg(e.message || 'Something went wrong. Please try again.', 'error');
    btn.disabled = false;
    btn.textContent = 'Send Reset Link';
  }
});

document.addEventListener('DOMContentLoaded', () => { Nav.render(); });
</script>
</body>
</html>
